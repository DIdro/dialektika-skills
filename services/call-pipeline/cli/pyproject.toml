[project]
name = "call-pipeline-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.14", "respx>=0.21"]

[project.scripts]
pipeline = "pipeline_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline_cli*"]
