# voice-kit — пример конфига.
#
# Скопируй этот файл рядом, под именем voice.config.yaml, и заполни под себя.
# Инструменты ищут voice.config.yaml (затем .yml, затем .json) в текущем
# каталоге и выше по дереву; можно указать явно: --config путь/к/файлу.
#
# Все относительные пути считаются от каталога, где лежит САМ конфиг.
# `~` раскрывается в домашний каталог.
#
# Если YAML неудобен (нет PyYAML и не хочется полагаться на встроенный
# разборщик подмножества) — назови файл voice.config.json и напиши то же
# самое в JSON. Схема та же, ключ в ключ.

# Чьим голосом пишем. Подставляется в тексты и в карты вместо жёсткого имени.
author: Имя Фамилия

# Каталог профиля: корпус, статьи, карты, stats.json, база правок.
# Профиль — личные данные владельца голоса, он живёт вне пакета и не
# коммитится (см. .gitignore).
profile: ./profile

# Источники фактуры. Порядок значения не имеет, значение имеет precedence.
# Поддержанные типы:
#   mionika          — граф проектов mIOnika, поле projects: список ключей
#   fact-registry    — файл-реестр фактов, поле path
#   files            — файлы по маске, поле glob
#   corpus           — корпус самого профиля (profile/corpus), полей нет
#   claude-sessions  — транскрипты сессий Claude Code по маске, поле path
#
# precedence: canon разрешён РОВНО одному источнику — тому, чей факт
# побеждает при расхождении. Двух канонов быть не может: тогда непонятно,
# кому верить, и загрузчик откажется читать конфиг.
#
# optional: true помечает источник, отсутствие которого не является поломкой.
sources:
  - type: mionika
    projects: [ключ-проекта, другой-ключ]

  - type: fact-registry
    path: ./facts.md
    precedence: canon

  - type: files
    glob: "notes/**/*.md"

  - type: corpus

  - type: claude-sessions
    path: "~/.claude/projects/<ключ-проекта>/*.jsonl"
    optional: true

# Интерпретатор, которым запускать инструменты (нужен скиллу, чтобы не
# угадывать). Достаточно любого Python 3.9+; внешних зависимостей у
# build_corpus/stats/lint/config нет.
python: C:/путь/к/python.exe

# Необязательный блок — только для export_telegram.py.
# Ни ключи, ни файл сессии в пакет не кладутся: заводи свои.
# telegram:
#   env: ./telegram.env      # файл со строками TG_API_ID=… и TG_API_HASH=…
#   session: ./tg            # путь к файлу сессии Telethon БЕЗ расширения
