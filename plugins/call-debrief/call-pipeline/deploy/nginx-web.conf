# Фрагменты для /etc/nginx/sites-available/call-pipeline (server-блок :8443).
# ВАЖНО: старые клиенты (CLI, боты) ходят на /jobs, /recordings, /admin БЕЗ
# префикса /api — их location'ы должны остаться. /api/ — доп. префикс для веба.

    # SPA
    root /var/www/call-pipeline-web;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # API для веб-фронта: /api/xxx → :8001/xxx (префикс срезается)
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 1100m;      # upload до 1 ГБ
        proxy_request_buffering off;      # стримим upload сразу в FastAPI
        proxy_read_timeout 300s;
    }

    # Очередь разбора: /ingest-api/xxx → ops-ingest:8002/xxx (префикс срезается)
    location /ingest-api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # accept ходит в LLM и базу знаний
    }

    # Легаси-пути для CLI/ботов (bearer) — как было, без префикса
    location ~ ^/(jobs|recordings|admin|health) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
